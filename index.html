<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scisso-game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="heading">
       <h1>rock-paper-scissor-game</h1>
       </div>
    <div class="choices">
        <div class="choice first" id="rock" >
            <img src="./image/stone.jpeg" alt="rock" height="150px" width="150px" />
        </div>
        <div class="choice second" id="paper">
            <img src="./image/paper.jpeg" alt="paper" height="160px" width="150px" />
        </div>
        <div class="choice third" id="scissor">
            <img src="./image/secissor.jpeg" alt="scissor" height="150px" width="150px" />
        </div>
    </div>
    <div class="score-bord">
        <div class="score">
            <p id="user-score">0</p>
                <p>you</p>
         </div>
         <div class="score">
            <p id="comp-score">0</p>
            <p>comp</p>
         </div>
    </div>
    <div class="msg-container">
        <P id="msg">play your turn</P>
    </div>
    <button class="resetbtn">Restart</button>
    <script src="script.js"></script>
</body>
</html>
